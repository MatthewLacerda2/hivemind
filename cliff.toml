# git-cliff — generates CHANGELOG.md from conventional commits (SPEC §13.5).
# Regenerate with: git cliff --output CHANGELOG.md

[changelog]
# Kept identical to the header already in CHANGELOG.md. `--prepend` rewrites it
# from here every time, so if the two disagree the file changes for no reason on
# every release.
header = """
# Changelog

All notable changes to this project are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)
and this project adheres to
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). From v0.2.0 the
entries are generated from conventional commits by
[`git-cliff`](https://git-cliff.org) — run `just changelog`. This first entry is
written by hand, because there is no previous release to diff against and a list
of commit subjects is not a description of what the thing does.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} **BREAKING**{% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  # Noise in a user-facing changelog: dependency bumps, CI tweaks, formatting.
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", group = "Miscellaneous" },
]
