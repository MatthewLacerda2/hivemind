# SPEC §13.3. Run with `just deny`; CI runs the same command.

[graph]
all-features = true
# Only the platforms we ship (SPEC §1: macOS primary, Linux in CI; no Windows
# in v1). Without this, the dependency graph includes branches we never
# compile — rusqlite's wasm VFS, for one — and the duplicate-version ban
# starts reporting conflicts that do not exist in any binary we produce.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
# An advisory against anything we ship fails the build. Accepting one means
# adding it here with a comment saying why and what the exit plan is.
# `.cargo/audit.toml` repeats the ids for `just audit`; the reasons live here.
ignore = [
    # `basic-toml` is unmaintained: archived, no vulnerability. It reaches us
    # only through `askama_derive`, which parses `askama.toml` with it inside a
    # proc-macro at build time, so nothing at runtime touches it. No askama
    # release has moved off it yet, 0.16.1 included. Exit: drop this the day
    # askama does, which `cargo tree -i basic-toml` will show as empty.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via askama_derive; no askama release avoids it yet" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93
# The allow-list is written for the dependency tree SPEC §15 describes, so most
# entries are unmatched until those crates land. Pruning it is a judgement call
# for a human, not a warning on every run.
unused-allowed-license = "allow"


[bans]
# "Where practical" (SPEC §13.3) is spelled out as: duplicates are a build
# failure, and every one we accept lands in `skip` with a reason and a way out.
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # Everything in the tree is on syn 3 except zerocopy-derive, which reaches
    # us through ciborium (half -> zerocopy) and proptest (ppv-lite86 ->
    # rand_chacha -> zerocopy). It is a proc macro, so the cost is compile time
    # and nothing in the shipped binary. We cannot fix it from here.
    # Way out: drop this entry when zerocopy releases against syn 3.
    { crate = "syn@2", reason = "zerocopy-derive has not moved to syn 3 yet" },

    # axum reaches base64 0.22 through hyper-util; rcgen reaches 0.23 through
    # pem. Two upstream trees, neither ours to move.
    # Way out: drop this when hyper-util moves to base64 0.23.
    { crate = "base64@0.22", reason = "hyper-util has not moved to base64 0.23 yet" },

    # Three of them: ours and cc/cmake's (0.4), ring's via rcgen (0.2), and
    # tempfile's (0.3).
    # Way out: drop each entry when ring and tempfile move to getrandom 0.4.
    { crate = "getrandom@0.2", reason = "ring has not moved to getrandom 0.4 yet" },
    { crate = "getrandom@0.3", reason = "tempfile has not moved to getrandom 0.4 yet" },

    # reqwest still asks for 0.6, and reaches us only as rmcp's MCP client in
    # hivemind-cli's tests, so the cost is test compile time and nothing in
    # the shipped binary.
    # Way out: drop this when reqwest moves to tower-http 0.7.
    { crate = "tower-http@0.6", reason = "reqwest, dev-only via rmcp's client, is on 0.6" },
]
skip-tree = []
deny = [
    # A second cryptography backend beside the `ring` this workspace chose.
    # Cargo unifies features, so whatever asks rustls for it turns it on for
    # `hivemind-net` too, and rustls then cannot pick a default provider: that
    # was the M3 panic. It arrived through reqwest's hyper-rustls.
    { crate = "aws-lc-rs", reason = "a second crypto backend; rustls panicked over it in M3" },
    { crate = "aws-lc-sys", reason = "a second crypto backend; rustls panicked over it in M3" },
    # HTTP clients here are written against hyper, and each says why in its
    # module doc: reqwest brought 107 crates to talk to 127.0.0.1. The one
    # exception is rmcp's MCP client, which only hivemind-cli's tests use.
    { crate = "reqwest", wrappers = ["rmcp"], reason = "clients here are written against hyper" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
