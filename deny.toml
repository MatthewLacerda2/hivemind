# SPEC §13.3. Run with `just deny`; CI runs the same command.

[graph]
all-features = true
# Only the platforms we ship (SPEC §1: macOS primary, Linux in CI; no Windows
# in v1). Without this, the dependency graph includes branches we never
# compile — rusqlite's wasm VFS, for one — and the duplicate-version ban
# starts reporting conflicts that do not exist in any binary we produce.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
# An advisory against anything we ship fails the build. Accepting one means
# adding it here with a comment saying why and what the exit plan is.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93
# The allow-list is written for the dependency tree SPEC §15 describes, so most
# entries are unmatched until those crates land. Pruning it is a judgement call
# for a human, not a warning on every run.
unused-allowed-license = "allow"


[bans]
# "Where practical" (SPEC §13.3) is spelled out as: duplicates are a build
# failure, and every one we accept lands in `skip` with a reason and a way out.
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # Everything in the tree is on syn 3 except zerocopy-derive, which reaches
    # us through ciborium (half -> zerocopy) and proptest (ppv-lite86 ->
    # rand_chacha -> zerocopy). It is a proc macro, so the cost is compile time
    # and nothing in the shipped binary. We cannot fix it from here.
    # Way out: drop this entry when zerocopy releases against syn 3.
    { crate = "syn@2", reason = "zerocopy-derive has not moved to syn 3 yet" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
