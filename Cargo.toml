[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/MatthewLacerda2/hivemind"
homepage = "https://github.com/MatthewLacerda2/hivemind"
authors = ["The hivemind contributors"]
keywords = ["claude", "mcp", "p2p", "messaging", "mail"]
categories = ["command-line-utilities", "network-programming"]

# Dependency versions are declared once here and inherited by every crate
# (`foo.workspace = true`) so a major bump is a single-line change (SPEC §15).
[workspace.dependencies]
hivemind-core = { path = "crates/hivemind-core", version = "0.1.0" }
hivemind-net = { path = "crates/hivemind-net", version = "0.1.0" }
hivemind-api = { path = "crates/hivemind-api", version = "0.1.0" }
hivemind-mcp = { path = "crates/hivemind-mcp", version = "0.1.0" }

anyhow = "1"
askama = "0.16"
async-stream = "0.3"
include_dir = "0.7"
mdns-sd = "0.21"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
axum = { version = "0.8", features = ["multipart"] }
futures-core = "0.3"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
directories = "6"
owo-colors = "4"
getrandom = "0.3"
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8", "rand_core"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
rmcp-client = { package = "rmcp", version = "3", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
schemars = "1"
# Only tests reach for this now — the CLI talks to loopback on hyper. No
# `rustls` feature: nothing that uses it speaks TLS, and asking for it pulls
# `hyper-rustls`, which turns on `rustls`'s `aws-lc-rs` for the whole build.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
toml = "1"
ulid = { version = "3", features = ["serde"] }

hex = "0.4"
# One function, and libc is already in the tree behind `sha2`. The alternative
# was reading /etc/hostname on Linux and shelling out to `scutil` on macOS.
hostname = "0.4"
http-body-util = "0.1"
proptest = "1"
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
# SPEC §13.1: no unsafe anywhere. `forbid` rather than `deny` so it is a
# guarantee rather than a coincidence — `deny` can be undone by a local
# `#[allow]`, and the rule is that an exception gets an ADR, not an attribute.
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Library code states its invariants with `expect("…")`, which names what was
# assumed when it turns out not to hold. `unwrap` in a test is the assertion
# itself, so test targets allow it back — see clippy.toml.
unwrap_used = "deny"
# Debugging leftovers must not survive a merge. Each of these is something
# somebody meant to remove and a review is a bad place to catch it.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# SPEC §13.1 asks for a *curated* allow-list. Each entry needs a reason.
# `hivemind_core::message::MessageId` is the idiomatic path here; renaming the
# types to satisfy this lint would make them worse at their call sites.
module_name_repetitions = "allow"
# Fires on nearly every getter in a domain-type crate and adds no safety.
must_use_candidate = "allow"
# We return `Result` from anything fallible; this lint wants prose for errors
# that are already named by their `thiserror` variants. Re-enable per-crate if
# a public API ever grows a non-obvious failure mode.
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"

# cargo-dist (`dist`) builds the release artifacts and the Homebrew formula.
# Evaluated and adopted in M6 — see
# docs/decisions/0011-cargo-dist-generates-the-release.md.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["homebrew", "shell"]
tap = "MatthewLacerda2/homebrew-tap"
# `brew install hivemind`, as SPEC §2 promises — not `hivemind-cli`, which is
# the crate's name and nobody's idea of what to type.
formula = "hivemind"
publish-jobs = ["homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
install-path = "CARGO_HOME"
# The web bundle is checked in and embedded at compile time, so a release needs
# no Node — but it is built first so a tag cannot ship a bundle older than the
# source it was built from.
build-local-artifacts = true
github-build-setup = "../build-setup.yml"

