name: Release

# Tag-driven. Nothing here runs on a normal push, so this workflow is inert
# until `v0.1.0` (SPEC §14, M6).
#
# M6 evaluates replacing the build matrix below with `cargo dist`'s generated
# workflow. The handwritten version exists now so that a release is possible
# from day one rather than being a thing we discover is broken at ship time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

# A tag push gets its own ref name; a manual dispatch has to be told. Everything
# below reads this instead of `github.ref_name`, so the two paths cannot drift.
env:
  VERSION: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The bundle is checked in and embedded at compile time, so this is not
      # strictly needed to produce a working binary — it is here so a release
      # cannot ship a bundle older than its source.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        run: cd web && npm ci && npm run build

      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }} -p hivemind-cli

      # Ad-hoc signature only. It is not notarisation and does not make the
      # binary trusted — it gives it a stable identity so macOS asks about the
      # firewall once instead of after every rebuild (SPEC §13.4).
      - name: Ad-hoc codesign
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/dist/hivemind

      - name: Package
        id: package
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          name="hivemind-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/dist/hivemind "dist/$name/"
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          shasum -a 256 "dist/$name.tar.gz" | awk '{print $1"  '"$name"'.tar.gz"}' > "dist/$name.tar.gz.sha256"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect checksums
        run: cat artifacts/*.sha256 > artifacts/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file <(awk '/^## /{if (seen) exit; seen=1} seen' CHANGELOG.md) \
            artifacts/*.tar.gz artifacts/SHA256SUMS
