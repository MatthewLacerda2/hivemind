name: CI

# CI speaks in two situations and no others: a pull request **claims to be
# finished**, and `main` moves.
#
# The invariant it rests on: a ready pull request claims it passes; a draft
# makes no such claim. CI's job is to check claims, so a red run always means a
# claim was broken, which is worth an email every time. A draft is how work
# survives a question that needs the user, a failure the agent could not
# resolve, or a session that ended badly — none of those asserts anything, so
# there is nothing to check.
#
# Silence on drafts is not leniency about unfinished work. It is having nothing
# asserted to it.
#
# `ready_for_review` in `types:` is load-bearing and omitting it fails *open*:
# it is not one of the defaults (`opened`, `synchronize`, `reopened`), so a
# pull request drafted, finished, and marked ready with no further push would
# get no run at all — and `just mergeable` would then refuse it, correctly but
# confusingly. Every job below carries the draft condition spelled out, because
# Actions has no workflow-level `if`.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A superseded run tells you nothing. Cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Every step below is a `just` recipe, and `just ci` runs the same list in the
  # same order. If you add a step here that is not a recipe, that is the bug
  # (SPEC §13.3).
  check:
    name: check (${{ matrix.os }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: rust-toolchain.toml pins the compiler and rustup
      # honours it, so CI cannot drift from what developers run locally.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-dist

      # The UI's bundle is checked in and embedded at compile time, so a clone
      # without Node still builds the daemon — but CI rebuilds it to prove the
      # committed bundle still matches its source.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Formatting
        run: just fmt-check

      - name: Clippy
        run: just lint

      - name: Docs
        run: just doc

      - name: Tests
        run: just test

      - name: Scripts
        run: just scripts

      # The layering is a rule in SPEC §3.1 and §10. A rule written only in
      # prose is true until somebody in a hurry writes the obvious line.
      # A ratchet: the limits only come down. See .github/scripts/size.py.
      - name: File sizes
        run: just size

      - name: Architectural boundaries
        run: just boundaries

      - name: Stale milestone markers
        run: just markers

      - name: Licences and advisories
        run: just deny

      - name: OpenAPI drift
        run: just openapi-check

      - name: Web UI
        run: just web-build

      # release.yml is generated by `dist`. This fails if somebody edited it by
      # hand, or changed the config without regenerating (ADR 0011).
      - name: Release workflow drift
        run: just dist-check

  coverage:
    name: coverage
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov

      # The 85% floor is live as of M1 (SPEC §13.2, §14). Coverage is a smoke
      # detector, not a target: if this fails, look at what is untested before
      # reaching for the number.
      - name: Coverage
        run: just cov-gate

      - name: Summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            just _cov-table || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
