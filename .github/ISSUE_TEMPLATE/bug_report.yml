name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, please do not file it here — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `hivemind doctor`
      description: This checks the daemon, ports, hooks and discovery in one go.
      render: text

  - type: input
    id: version
    attributes:
      label: hivemind version
      placeholder: "hivemind --version"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "macOS 15.6 / Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant lines from ~/.hivemind/daemon.log
      description: Redact anything you would not want public.
      render: text
