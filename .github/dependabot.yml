version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR for the whole batch: reviewing twelve patch bumps separately is how
    # people stop reviewing them.
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    # `dist` generates release.yml and pins its own action versions, so
    # `just dist-check` fails any hand edit, Dependabot's included (#125).
    # Upgrading dist is what moves those.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
